  <rect x="260" y="46" width="140" height="188" rx="8" fill="#f4f7fb"/>
  <rect x="272" y="60" width="116" height="72" rx="4" fill="#d5e0ee"/>
  <path d="M272 120 L300 96 L324 114 L360 84 L388 120 L388 132 L272 132 Z" fill="#8eabc8"/>
  <circle cx="292" cy="84" r="6" fill="#f4e7c3"/>
  <rect x="280" y="68" width="78" height="18" rx="9" fill="#101826" stroke="#78dcb4" stroke-width="1"/>
  <text x="290" y="80.5" fill="#f4f8ff" font-family="Inter, Liberation Sans, sans-serif" font-size="9" font-weight="600">local signal</text>
  <rect x="272" y="146" width="100" height="5" rx="2" fill="#d0d8e4"/>
  <rect x="272" y="158" width="116" height="5" rx="2" fill="#d0d8e4"/>

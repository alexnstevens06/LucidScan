<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <title>LucidScan</title>
  <desc>440 by 280 promotional tile. A graphic of an on-device local-signal badge, not a product screenshot.</desc>
  <rect width="440" height="280" fill="#0f141d"/>
  <rect width="6" height="280" fill="#6bc4a0"/>
  <text x="28" y="52" fill="#6bc4a0" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">LOCAL SIGNAL</text>
  <text x="28" y="98" fill="#e8eef7" font-family="Inter, Liberation Sans, sans-serif" font-size="34" font-weight="650">LucidScan</text>
  <text x="28" y="132" fill="#f4f8ff" font-family="Inter, Liberation Sans, sans-serif" font-size="18" font-weight="600">A signal, not a verdict.</text>
  <text x="28" y="176" fill="#9aabbf" font-family="Inter, Liberation Sans, sans-serif" font-size="14">On-device badges for images</text>
  <text x="28" y="196" fill="#9aabbf" font-family="Inter, Liberation Sans, sans-serif" font-size="14">and selected text, only on</text>
  <text x="28" y="216" fill="#9aabbf" font-family="Inter, Liberation Sans, sans-serif" font-size="14">sites you turn on.</text>

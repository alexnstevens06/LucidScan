name: CI

on:
  # push only on main; PR commits are covered by pull_request (avoids every PR commit running twice)
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Byte-compile Python files
        run: python -m compileall -q -x "/\.git/" .
      - name: Syntax-check extension JavaScript
        run: find chrome_plugin -name "*.js" -print0 | xargs -0 -n1 node --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm test (syntax checks + health_check + node unit tests)
        run: npm test
      - name: health_check (manifest / policy, explicit)
        run: python3 chrome_plugin/scripts/health_check.py

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: ESLint (extension source)
        run: npm run lint
      - name: Typecheck (checkJs + JSDoc)
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Extension e2e (headless Chromium, local fixture)
        run: npm run test:e2e

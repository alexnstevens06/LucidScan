name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Byte-compile Python files
        run: python -m compileall -q -x "/\.git/" .
      - name: Syntax-check extension JavaScript
        run: find chrome_plugin -name "*.js" -print0 | xargs -0 -n1 node --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm test (syntax checks + health_check + node unit tests)
        run: npm test
      - name: health_check (manifest / policy, explicit)
        run: python3 chrome_plugin/scripts/health_check.py
